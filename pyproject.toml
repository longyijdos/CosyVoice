[project]
name = "cosyvoice-local"
version = "0.0.0"
description = "Local uv environment for CosyVoice."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "conformer==0.3.2",
    "deepspeed==0.15.1; sys_platform == 'linux'",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "ctranslate2==4.8.1",
    "faster-whisper==1.2.1",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0; sys_platform == 'linux'",
    "onnxruntime==1.18.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "openai-whisper==20250625",
    "opencc-python-reimplemented==0.1.7",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "setuptools==69.5.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "tensorrt-cu12==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-bindings==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-libs==10.13.3.9; sys_platform == 'linux'",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.51.3",
    "uvicorn==0.30.0",
    "wetext==0.0.4",
    "wheel==0.47.0",
    "wget==3.2",
    "x-transformers==2.11.24",
]

[tool.uv]
package = false
no-build-isolation-package = ["openai-whisper"]

# CosyVoice depends on a few legacy source distributions with incomplete build metadata.
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools==69.5.1", "wheel==0.47.0"]
pyworld = ["numpy==1.26.4", "cython==3.2.8", "setuptools==69.5.1", "wheel==0.47.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
onnxruntime-gpu = { index = "onnxruntime-cuda-12" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true
